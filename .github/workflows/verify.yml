name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python3 -m compileall -q node_files

      - name: Check Shell syntax
        run: bash -n install.sh

      - name: Validate workflow JSON
        run: python3 -m json.tool vibecoding_sora-2.json >/dev/null

      - name: Check whitespace
        run: git diff --check
